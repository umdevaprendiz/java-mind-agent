spring:
  application:
    name: java-mind-agent
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    fail-on-missing-locations: false
  ai:
    ollama:
      # Ollama roda no host (decisão D2); sobrescreva com OLLAMA_BASE_URL se necessário.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    vectorstore:
      pgvector:
        # O schema (inclusive a tabela de embeddings) é criado pelo Flyway (F03), não pelo Spring AI.
        initialize-schema: false

server:
  port: 8080

springdoc:
  swagger-ui:
    # Contrato escrito à mão (api/openapi.yaml, F04) em primeiro; o spec gerado pelo código fica ao lado para comparar.
    urls:
      - name: Contrato (api/openapi.yaml)
        url: /api-contract/openapi.yaml
      - name: Implementação (gerado do código)
        url: /v3/api-docs
    urls-primary-name: Contrato (api/openapi.yaml)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  cors:
    # Origens autorizadas a chamar /api/** (front React em desenvolvimento).
    allowed-origins:
      - http://localhost:5173
  models:
    # Tier padrão enquanto o usuário não salvar outro (app_setting "default.tier").
    default-tier: medium
    capacity:
      # RAM necessária = tamanho do modelo em disco x este fator (pesos + cache de contexto).
      overhead-factor: 1.3
      # RAM (GiB) que não conta para o modelo: sistema, IDE, navegador, Postgres e Docker.
      reserved-ram-gb: 3
    pull:
      # Download sem dados por este tempo = travado. O tempo total não tem limite (modelos têm GBs); um download
      # interrompido continua de onde parou ao baixar de novo.
      idle-timeout: 2m
      # Intervalo mínimo entre dois eventos de progresso enviados ao front (o Ollama manda dezenas por segundo).
      progress-interval: 250ms
      # Tempo máximo para carregar um modelo na memória ao aquecê-lo (em CPU, um 7B leva cerca de 40 s).
      warmup-timeout: 5m
    # Cada tier aponta para um modelo do Ollama. Para usar outro computador com mais RAM/GPU em um tier, descomente
    # base-url (ex.: no extra); nesse caso o "cabe" é presumido. min-ram-gb em GiB; speed: fast | medium | slow | very_slow
    # (velocidade medida nesta máquina, só CPU: o 7B roda a ~2 tokens/s).
    tiers:
      low:
        label: Baixo
        description: Respostas rápidas para dúvidas simples. Erra mais em perguntas difíceis.
        ollama-model: qwen2.5:3b
        min-ram-gb: 2.5
        speed: fast
      medium:
        label: Médio
        description: Uso geral, equilíbrio entre qualidade e velocidade.
        ollama-model: qwen2.5:7b
        min-ram-gb: 6
        speed: slow
      strong:
        label: Forte
        description: Mais preciso em código e questões difíceis, mas bem mais lento. Ocupa quase toda a RAM.
        ollama-model: qwen2.5:14b
        min-ram-gb: 12
        speed: very_slow
      extra:
        label: Extra
        description: O mais capaz, com raciocínio. Pede muita RAM ou GPU; use em outro computador.
        ollama-model: qwen3:32b
        min-ram-gb: 26
        speed: very_slow
        # base-url: http://meu-servidor:11434
    embedding:
      model: bge-m3
      min-ram-gb: 1.5
  knowledge:
    # Versão do Java assumida quando nada indica outra (nem a pergunta, nem a conversa, nem o código, nem as
    # preferências). Vazio = a LTS mais recente do registro (src/main/resources/knowledge/java-versions.json).
    # default-java-version: 25
    # Versão assumida quando a pessoa pede uma "versão antiga" sem dizer qual.
    legacy-java-version: 8

---
spring:
  config:
    activate:
      on-profile: dev

management:
  endpoint:
    health:
      show-details: always

app:
  models:
    debug:
      # POST /internal/models/stream: stream de qualquer modelo local, para testar e medir velocidade (F05).
      endpoint-enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
