# Perfil dos testes de fumaça: sobe o contexto sem Postgres/Docker/Ollama.
# Testes de integração com banco real usam Testcontainers (F03).
spring:
  docker:
    compose:
      enabled: false
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/inexistente
    username: teste
    password: teste
    hikari:
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    # Necessário porque o teste não acessa o banco para descobrir o dialeto (o aviso HHH90000025 é esperado).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

management:
  health:
    db:
      enabled: false

app:
  models:
    # Não consulta Ollama nem hardware na subida dos testes.
    startup-report: false
